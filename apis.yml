aid: anumana
name: Anumana
description: 'Anumana, Inc. is a cardiac AI health-technology company founded as a joint
  venture between Mayo Clinic and nference, commercializing ECG-AI algorithms that read
  standard 10-second, 12-lead electrocardiograms to surface disease signals that are not
  visible to the human eye. Its portfolio includes the FDA-cleared ECG-AI LEF algorithm for
  detecting low ejection fraction in patients at risk of heart failure (trained on roughly
  2.9 million ECG-echo pairs across 676,000+ patients), the first and only FDA-cleared
  ECG-AI algorithm for cardiac amyloidosis, and an FDA-cleared algorithm for early detection
  of pulmonary hypertension, plus a pipeline that includes hyperkalemia. Anumana is delivered
  as a regulated medical device that runs inside the customer''s own ECG management system
  and EHR environment, ingesting digital waveform files and returning results into clinical
  workflow rather than being consumed as a public developer API.'
